<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Flash-Sale Ticket Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css">
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-6 font-sans">

  <header class="w-full max-w-3xl flex justify-between items-center pb-6 border-b border-slate-800 mb-8">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-tight">Flash-Sale Ticket Engine</h1>
    </div>
    <div id="wsStatus" class="text-xs px-3 py-1 bg-rose-950/60 border border-rose-800 text-rose-300 rounded-full transition-all duration-300">
      WebSocket: Отключен
    </div>
  </header>

  <main class="w-full max-w-3xl grid grid-cols-1 md:grid-cols-2 gap-6">

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex flex-col justify-between">
      <div>
        <span class="text-xs uppercase font-semibold text-indigo-400 tracking-wider">Горячее событие</span>
        <h2 class="text-2xl font-bold mt-1">Концерт рок-группы</h2>
        <p class="text-sm text-slate-400 mt-2">Ограниченная серия билетов с защитой от овербукинга и Saga-транзакцией.</p>

        <div class="mt-6 space-y-3">
          <div>
            <label class="text-xs text-slate-400">ID пользователя (User ID):</label>
            <input id="userIdInput" type="number" value="42" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm mt-1 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-xs text-slate-400">Сумма заказа (₽):</label>
            <input id="priceInput" type="number" value="5000" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm mt-1 focus:outline-none focus:border-indigo-500">
            <span class="text-[10px] text-slate-500 block mt-1">* > 100 000 для теста Saga Rollback, 666 для DLQ</span>
          </div>
        </div>
      </div>

      <div class="mt-6 space-y-2">
        <button id="buyBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
          ⚡ Забронировать и купить
        </button>
        <button id="initStockBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg transition">
          🔄 Завезти 10 билетов на склад (Init)
        </button>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-sm font-semibold uppercase text-slate-400 tracking-wider">Лента событий (Real-Time)</h3>
        <button id="clearLogsBtn" class="text-xs text-slate-500 hover:text-slate-300">Очистить</button>
      </div>
      <div id="logs" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-3 overflow-y-auto max-h-80 font-mono text-xs space-y-2">
        <div class="text-slate-500">Ожидание действий...</div>
      </div>
    </div>

  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
